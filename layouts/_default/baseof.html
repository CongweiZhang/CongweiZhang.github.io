<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="{{ site.Params.description }}">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Params.name }}{{ end }}</title>
  <link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
  <link rel="canonical" href="{{ .Permalink }}">
  <script src="{{ "js/site.js" | relURL }}" defer></script>
</head>
<body>
  <div class="wrap">
    <header class="header">
      <a class="brand" href="{{ "" | relURL }}">Congwei Zhang <span>张琮伟</span></a>
      <button class="menu" aria-expanded="false" aria-controls="navigation">Menu ☰</button>
      <nav id="navigation" aria-label="Main navigation">
        <a href="{{ "" | relURL }}">Home</a>
        <a href="{{ "publications/" | relURL }}">Publications</a>
        <a href="{{ "projects/" | relURL }}">Projects</a>
        <a href="{{ "news/" | relURL }}">News</a>
        <a href="{{ "service/" | relURL }}">Service</a>
      </nav>
    </header>
    <main>{{ block "main" . }}{{ end }}</main>
    <footer class="footer"><span>© {{ now.Year }} Congwei Zhang</span><span>Built with Hugo · Hosted on GitHub Pages</span></footer>
  </div>
</body>
</html>
