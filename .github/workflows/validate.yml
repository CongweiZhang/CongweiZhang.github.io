name: Validate Hugo site
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.14.0'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.162.0'
          extended: true
      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Install Hugo modules
        run: hugo mod get
      - name: Build site
        run: hugo --minify --baseURL "https://congweizhang.github.io/"
